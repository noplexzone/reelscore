services:
  reelscore:
    image: noplexzone/reelscore:develop
    build: .
    container_name: reelscore
    labels:
      project: reelscore
      managed-by: jarvis
    ports:
      - "3210:3000"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY:?Set TMDB_API_KEY in .env}
      - APP_MODE=${APP_MODE:-self_hosted}
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET in .env}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - REGISTRATION_MODE=${REGISTRATION_MODE:-}
      - TRUST_PROXY=${TRUST_PROXY:-0}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:-}
      - CREDENTIAL_ENCRYPTION_KEY_ID=${CREDENTIAL_ENCRYPTION_KEY_ID:-active}
      - CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS=${CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS:-}
      - PLEX_CLIENT_IDENTIFIER=${PLEX_CLIENT_IDENTIFIER:-}
      - PLEX_ALLOWED_SERVER_ID=${PLEX_ALLOWED_SERVER_ID:-}
      - PLEX_ALLOWED_ORIGINS=${PLEX_ALLOWED_ORIGINS:-}
      - PLEX_HISTORY_ACCOUNT_ID=${PLEX_HISTORY_ACCOUNT_ID:-}
      - ONBOARDING_PLACEHOLDER_DATE=${ONBOARDING_PLACEHOLDER_DATE:-}
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID:-}
      - TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
